<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Settings - Glitch Bistro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Injection -->
        <div id="app-sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="app-main-content">
            <!-- Navbar Injection -->
            <div id="app-navbar-container"></div>

            <!-- Page Content -->
            <main class="p-4">
                
                <!-- Action Header -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div>
                        <h3 class="font-heading fw-bold text-white mb-1">System Settings</h3>
                        <p class="text-muted small m-0">Configure restaurant profile, tax rates, delivery options, receipts & UI preferences.</p>
                    </div>
                </div>

                <form id="settings-form" onsubmit="handleSaveSettingsSubmit(event)">
                    <div class="row g-4">
                        
                        <!-- Left Column: Restaurant Info & Order Options -->
                        <div class="col-lg-6">
                            
                            <!-- Restaurant Information Card -->
                            <div class="glass-card mb-4">
                                <h5 class="font-heading fw-bold text-white mb-3"><i class="bi bi-shop text-info me-2"></i>Restaurant Profile</h5>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="set-name" class="form-label small text-muted">Restaurant Name *</label>
                                        <input type="text" id="set-name" class="form-control form-control-glitch" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-phone" class="form-label small text-muted">Phone Number *</label>
                                        <input type="text" id="set-phone" class="form-control form-control-glitch" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-email" class="form-label small text-muted">Email Address *</label>
                                        <input type="email" id="set-email" class="form-control form-control-glitch" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-currency" class="form-label small text-muted">Currency Symbol *</label>
                                        <input type="text" id="set-currency" class="form-control form-control-glitch" required placeholder="$">
                                    </div>
                                    <div class="col-12">
                                        <label for="set-address" class="form-label small text-muted">Physical Address *</label>
                                        <input type="text" id="set-address" class="form-control form-control-glitch" required>
                                    </div>
                                    <div class="col-12">
                                        <label for="set-logo" class="form-label small text-muted">Logo URL</label>
                                        <input type="url" id="set-logo" class="form-control form-control-glitch">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-tax" class="form-label small text-muted">Tax Rate (%) *</label>
                                        <input type="number" id="set-tax" class="form-control form-control-glitch" step="0.5" min="0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-deliv-fee" class="form-label small text-muted">Default Delivery Fee ($) *</label>
                                        <input type="number" id="set-deliv-fee" class="form-control form-control-glitch" step="0.5" min="0" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Order Rules Card -->
                            <div class="glass-card mb-4">
                                <h5 class="font-heading fw-bold text-white mb-3"><i class="bi bi-sliders text-purple me-2"></i>Order Channels & Rules</h5>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-enable-dinein">
                                            <label class="form-check-label text-white small" for="set-enable-dinein">Enable Dine-In</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-enable-takeaway">
                                            <label class="form-check-label text-white small" for="set-enable-takeaway">Enable Takeaway</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-enable-deliv">
                                            <label class="form-check-label text-white small" for="set-enable-deliv">Enable Delivery</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mt-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-auto-confirm">
                                            <label class="form-check-label text-info small" for="set-auto-confirm">Auto-Confirm Incoming Orders</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-prep-time" class="form-label small text-muted">Default Kitchen Prep Time (mins)</label>
                                        <input type="number" id="set-prep-time" class="form-control form-control-glitch" min="5" value="25">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Right Column: Receipt Template, Appearance & Data Management -->
                        <div class="col-lg-6">
                            
                            <!-- Receipt Customization Card -->
                            <div class="glass-card mb-4">
                                <h5 class="font-heading fw-bold text-white mb-3"><i class="bi bi-printer text-success me-2"></i>Print Receipt Template</h5>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="set-receipt-header" class="form-label small text-muted">Receipt Header Message</label>
                                        <input type="text" id="set-receipt-header" class="form-control form-control-glitch">
                                    </div>
                                    <div class="col-12">
                                        <label for="set-receipt-footer" class="form-label small text-muted">Receipt Footer Message</label>
                                        <input type="text" id="set-receipt-footer" class="form-control form-control-glitch">
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-receipt-tax">
                                            <label class="form-check-label text-white small" for="set-receipt-tax">Show Tax Breakdown</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="set-receipt-customer">
                                            <label class="form-check-label text-white small" for="set-receipt-customer">Show Customer Details</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Appearance Preferences -->
                            <div class="glass-card mb-4">
                                <h5 class="font-heading fw-bold text-white mb-3"><i class="bi bi-palette text-amber me-2"></i>Appearance & Theme</h5>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="set-theme" class="form-label small text-muted">Color Mode</label>
                                        <select id="set-theme" class="form-select form-select-glitch" onchange="applyAppearanceTheme(this.value)">
                                            <option value="dark">Dark Theme (Glitch Software)</option>
                                            <option value="light">Light Theme</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="set-accent" class="form-label small text-muted">Accent Glow Color</label>
                                        <select id="set-accent" class="form-select form-select-glitch">
                                            <option value="cyan">Glitch Cyan (#00f2fe)</option>
                                            <option value="purple">Electric Purple (#a855f7)</option>
                                            <option value="emerald">Neon Emerald (#10b981)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Reset Demo Data Card -->
                            <div class="glass-card border-danger mb-4">
                                <h5 class="font-heading fw-bold text-danger mb-2"><i class="bi bi-exclamation-triangle-fill me-2"></i>Data Management</h5>
                                <p class="text-muted small mb-3">Restore initial 20 realistic orders, 18 menu items, and 10 customers to default factory state.</p>
                                <button type="button" onclick="confirmResetDemoData()" class="btn btn-glass btn-glass-danger w-100 justify-content-center">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Demo Data
                                </button>
                            </div>

                        </div>

                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-glitch py-3 px-5 font-heading fs-6">
                                <i class="bi bi-check-lg me-1"></i> Save All Settings
                            </button>
                        </div>

                    </div>
                </form>

            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
