<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Order (POS) - Glitch Bistro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Injection -->
        <div id="app-sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="app-main-content">
            <!-- Navbar Injection -->
            <div id="app-navbar-container"></div>

            <!-- Page Content -->
            <main class="p-4">
                
                <form id="pos-order-form" onsubmit="handlePlaceOrderSubmit(event)">
                    <div class="row g-4">
                        
                        <!-- Left Panel: Menu Items Grid & Customer Info -->
                        <div class="col-lg-7 col-xl-8">
                            
                            <!-- Customer & Order Setup Card -->
                            <div class="glass-card mb-4">
                                <h5 class="font-heading fw-bold text-white mb-3"><i class="bi bi-person-badge text-info me-2"></i>1. Customer & Order Details</h5>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="pos-customer-name" class="form-label small text-muted fw-semibold">Customer Name *</label>
                                        <input type="text" id="pos-customer-name" class="form-control form-control-glitch" placeholder="e.g. John Doe" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="pos-customer-phone" class="form-label small text-muted fw-semibold">Phone Number *</label>
                                        <input type="tel" id="pos-customer-phone" class="form-control form-control-glitch" placeholder="+1 (555) 000-0000" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="pos-order-type" class="form-label small text-muted fw-semibold">Order Type *</label>
                                        <select id="pos-order-type" class="form-select form-select-glitch">
                                            <option value="dine-in">Dine-in</option>
                                            <option value="takeaway">Takeaway</option>
                                            <option value="delivery">Delivery</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4" id="group-table-number">
                                        <label for="pos-table-number" class="form-label small text-muted fw-semibold">Table Number *</label>
                                        <input type="text" id="pos-table-number" class="form-control form-control-glitch" placeholder="e.g. Table 05">
                                    </div>
                                    <div class="col-md-8 d-none" id="group-delivery-address">
                                        <label for="pos-delivery-address" class="form-label small text-muted fw-semibold">Delivery Address *</label>
                                        <input type="text" id="pos-delivery-address" class="form-control form-control-glitch" placeholder="Street name, building, apartment #">
                                    </div>
                                </div>
                            </div>

                            <!-- Menu Catalog Section -->
                            <div class="glass-card">
                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                                    <h5 class="font-heading fw-bold text-white m-0"><i class="bi bi-menu-app text-purple me-2"></i>2. Menu Selection</h5>
                                    <div class="input-group" style="max-width: 260px;">
                                        <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-search"></i></span>
                                        <input type="text" id="pos-search-menu" class="form-control form-control-glitch" placeholder="Search dish..." oninput="renderPosMenuGrid()">
                                    </div>
                                </div>

                                <!-- Category Filter Pills -->
                                <div class="d-flex overflow-x-auto pb-2 mb-3" id="pos-category-pills">
                                    <!-- Rendered dynamically -->
                                </div>

                                <!-- Product Cards Grid -->
                                <div class="row g-3" id="pos-menu-grid" style="max-height: 520px; overflow-y: auto;">
                                    <!-- Rendered dynamically -->
                                </div>
                            </div>
                        </div>

                        <!-- Right Panel: Cart & Payment Checkout -->
                        <div class="col-lg-5 col-xl-4">
                            <div class="glass-card position-sticky" style="top: 90px;">
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <h5 class="font-heading fw-bold text-white m-0"><i class="bi bi-cart-fill text-info me-2"></i>Current Order Cart</h5>
                                    <button type="button" class="btn btn-sm btn-link text-muted p-0 text-decoration-none" onclick="posCart=[]; renderPosCart();">Clear Cart</button>
                                </div>

                                <!-- Cart Items List -->
                                <div id="pos-cart-items-container" class="mb-3" style="max-height: 250px; overflow-y: auto;">
                                    <!-- Loaded dynamically -->
                                </div>

                                <!-- Payment & Notes Section -->
                                <div class="mb-3">
                                    <label for="pos-notes" class="form-label small text-muted fw-semibold">Customer Notes</label>
                                    <textarea id="pos-notes" class="form-control form-control-glitch" rows="2" placeholder="Special instructions, allergies, etc."></textarea>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label for="pos-payment-method" class="form-label small text-muted fw-semibold">Payment Method</label>
                                        <select id="pos-payment-method" class="form-select form-select-glitch">
                                            <option value="ONLINE_CARD">💳 Online Card (Paymob)</option>
                                            <option value="MOBILE_WALLET">📱 Mobile Wallet (Paymob)</option>
                                            <option value="CASH">💵 Cash</option>
                                            <option value="CARD_TERMINAL">🖥️ Card Terminal (POS)</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label for="pos-discount-input" class="form-label small text-muted fw-semibold">Discount ($)</label>
                                        <input type="number" id="pos-discount-input" class="form-control form-control-glitch" value="0" min="0" step="0.5" oninput="calculatePosTotals()">
                                    </div>
                                </div>

                                <!-- Dynamic Price Calculation Summary -->
                                <div class="p-3 mb-3 rounded-3 bg-dark border border-secondary">
                                    <div class="d-flex justify-content-between small text-muted mb-1">
                                        <span>Subtotal:</span>
                                        <span id="pos-subtotal-text">$0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between small text-muted mb-1">
                                        <span>Tax:</span>
                                        <span id="pos-tax-text">$0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between small text-muted mb-1">
                                        <span>Delivery Fee:</span>
                                        <span id="pos-delivery-text">$0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between small text-danger mb-1">
                                        <span>Discount:</span>
                                        <span id="pos-discount-text">-$0.00</span>
                                    </div>
                                    <hr class="my-2 border-secondary">
                                    <div class="d-flex justify-content-between font-heading text-white fw-bold fs-4">
                                        <span>Final Total:</span>
                                        <span id="pos-final-total-text" class="text-info">$0.00</span>
                                    </div>
                                </div>

                                <button type="submit" id="btn-place-order" class="btn btn-glitch w-100 py-3 font-heading fs-6 justify-content-center">
                                    <i class="bi bi-check-circle-fill fs-5 me-1"></i>
                                    Place Order & Pay
                                </button>
                            </div>
                        </div>

                    </div>
                </form>

            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/new-order.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
