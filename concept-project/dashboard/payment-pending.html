<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Pending - Glitch Bistro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #060813;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .result-card {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            background: rgba(15, 21, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="result-card">
        <div class="mb-3 text-warning">
            <i class="bi bi-hourglass-split fs-1"></i>
        </div>

        <h3 class="font-heading fw-bold text-white mb-2">Payment Awaiting Confirmation</h3>
        <p class="text-muted small mb-4">Your payment intention has been initialized with Paymob. Once your payment is completed on the Paymob hosted checkout screen, your status will update automatically.</p>

        <div class="d-flex gap-2 justify-content-center">
            <a href="orders.html" class="btn btn-glitch">
                <i class="bi bi-receipt me-1"></i> Check Orders List
            </a>
            <a href="index.html" class="btn btn-glass">
                <i class="bi bi-house me-1"></i> Dashboard
            </a>
        </div>
    </div>

</body>
</html>
