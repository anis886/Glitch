<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - Glitch Bistro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Injection -->
        <div id="app-sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="app-main-content">
            <!-- Navbar Injection -->
            <div id="app-navbar-container"></div>

            <!-- Page Content -->
            <main class="p-4">
                
                <!-- Action Header -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div>
                        <h3 class="font-heading fw-bold text-white mb-1">Menu Management</h3>
                        <p class="text-muted small m-0">Organize restaurant dishes, prices, preparation times, and stock availability.</p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <!-- Card / Table View Toggle Buttons -->
                        <div class="btn-group me-2">
                            <button id="btn-view-card" onclick="setMenuViewMode('card')" class="btn btn-glitch py-1 px-3">
                                <i class="bi bi-grid-fill me-1"></i> Grid Cards
                            </button>
                            <button id="btn-view-table" onclick="setMenuViewMode('table')" class="btn btn-glass py-1 px-3">
                                <i class="bi bi-list-ul me-1"></i> Table View
                            </button>
                        </div>
                        <button onclick="openAddMenuModal()" class="btn btn-glitch btn-glitch-purple">
                            <i class="bi bi-plus-lg me-1"></i> Add Menu Item
                        </button>
                    </div>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="glass-card p-3 mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="menu-search-input" class="form-control form-control-glitch" placeholder="Search dish name or description..." oninput="applyMenuFilters()">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select id="menu-category-filter" class="form-select form-select-glitch" onchange="applyMenuFilters()">
                                <option value="all">All Categories</option>
                                <option value="Burgers">Burgers</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Main Meals">Main Meals</option>
                                <option value="Appetizers">Appetizers</option>
                                <option value="Drinks">Drinks</option>
                                <option value="Desserts">Desserts</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select id="menu-availability-filter" class="form-select form-select-glitch" onchange="applyMenuFilters()">
                                <option value="all">All Stock Status</option>
                                <option value="available">In Stock</option>
                                <option value="unavailable">Out of Stock</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select id="menu-sort-filter" class="form-select form-select-glitch" onchange="applyMenuFilters()">
                                <option value="name">Sort by Name</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="sales">Most Popular (Sales)</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button onclick="clearMenuFilters()" class="btn btn-glass w-100 justify-content-center" title="Reset Filters">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Menu Content Container (Grid or Table View) -->
                <div id="menu-content-container" class="row g-4">
                    <!-- Loaded dynamically via menu.js -->
                </div>

            </main>
        </div>
    </div>

    <!-- Add/Edit Menu Item Modal -->
    <div class="modal fade" id="menu-item-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-modal">
                <form id="menu-item-form" onsubmit="handleSaveMenuItem(event)">
                    <div class="modal-header border-bottom border-secondary">
                        <h5 class="modal-title font-heading fw-bold text-white" id="menu-modal-title">Add New Menu Item</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="menu-form-name" class="form-label small text-muted fw-semibold">Item Name *</label>
                                <input type="text" id="menu-form-name" class="form-control form-control-glitch" required placeholder="e.g. Glitch Smash Burger">
                            </div>
                            <div class="col-md-4">
                                <label for="menu-form-category" class="form-label small text-muted fw-semibold">Category *</label>
                                <select id="menu-form-category" class="form-select form-select-glitch" required>
                                    <option value="Burgers">Burgers</option>
                                    <option value="Pizza">Pizza</option>
                                    <option value="Main Meals">Main Meals</option>
                                    <option value="Appetizers">Appetizers</option>
                                    <option value="Drinks">Drinks</option>
                                    <option value="Desserts">Desserts</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="menu-form-price" class="form-label small text-muted fw-semibold">Price ($) *</label>
                                <input type="number" id="menu-form-price" class="form-control form-control-glitch" step="0.01" min="0" required placeholder="14.99">
                            </div>
                            <div class="col-md-6">
                                <label for="menu-form-preptime" class="form-label small text-muted fw-semibold">Prep Time (mins) *</label>
                                <input type="number" id="menu-form-preptime" class="form-control form-control-glitch" min="1" required placeholder="15">
                            </div>
                            
                            <div class="col-md-8">
                                <label for="menu-form-image" class="form-label small text-muted fw-semibold">Image URL *</label>
                                <input type="url" id="menu-form-image" class="form-control form-control-glitch" required placeholder="https://images.unsplash.com/photo-...">
                                <small class="text-muted" style="font-size: 0.75rem;">Enter image direct URL (Unsplash or web image link)</small>
                            </div>
                            <div class="col-md-4 text-center">
                                <label class="form-label small text-muted fw-semibold d-block">Live Preview</label>
                                <img id="menu-form-image-preview" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80" alt="Preview" class="rounded-3 border border-secondary" style="width: 80px; height: 60px; object-fit: cover;">
                            </div>

                            <div class="col-12">
                                <label for="menu-form-description" class="form-label small text-muted fw-semibold">Description *</label>
                                <textarea id="menu-form-description" class="form-control form-control-glitch" rows="3" required placeholder="Describe ingredients, flavor profile..."></textarea>
                            </div>

                            <div class="col-md-6">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input bg-dark border-secondary" type="checkbox" role="switch" id="menu-form-available" checked>
                                    <label class="form-check-label text-white small" for="menu-form-available">Available in Stock</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input bg-dark border-secondary" type="checkbox" role="switch" id="menu-form-featured">
                                    <label class="form-check-label text-warning small fw-bold" for="menu-form-featured">Feature on Menu Highlight</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-glitch"><i class="bi bi-save me-1"></i> Save Menu Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
