<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Glitch Bistro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Injection -->
        <div id="app-sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="app-main-content">
            <!-- Navbar Injection -->
            <div id="app-navbar-container"></div>

            <!-- Page Content -->
            <main class="p-4">
                
                <!-- Action Header -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div>
                        <h3 class="font-heading fw-bold text-white mb-1">Customer Records</h3>
                        <p class="text-muted small m-0">Track customer order history, spent amounts, VIP tiers & staff notes.</p>
                    </div>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="glass-card p-3 mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="customer-search-input" class="form-control form-control-glitch" placeholder="Search customer by name or phone..." oninput="applyCustomerFilters()">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="customer-sort-filter" class="form-select form-select-glitch" onchange="applyCustomerFilters()">
                                <option value="spent">Sort by Highest Total Spent</option>
                                <option value="orders">Sort by Total Orders</option>
                                <option value="date">Sort by Recent Activity</option>
                                <option value="name">Sort by Name</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button onclick="document.getElementById('customer-search-input').value=''; applyCustomerFilters();" class="btn btn-glass w-100 justify-content-center">
                                Clear Search
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Customers Table -->
                <div class="glass-card">
                    <div class="custom-table-container">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Customer ID</th>
                                    <th>Customer Name</th>
                                    <th>Phone Number</th>
                                    <th>Tier Status</th>
                                    <th class="text-center">Total Orders</th>
                                    <th>Total Spent</th>
                                    <th>Last Order Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="customers-table-tbody">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Customer Details & Order History Modal -->
    <div class="modal fade" id="customer-details-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-modal">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title font-heading fw-bold text-white" id="customer-modal-title">Customer Profile</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="customer-modal-body">
                    <!-- Populated dynamically -->
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Customer Notes Modal -->
    <div class="modal fade" id="customer-notes-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <form onsubmit="handleSaveCustomerNotes(event)">
                    <div class="modal-header border-bottom border-secondary">
                        <h5 class="modal-title font-heading fw-bold text-white">Edit Notes for <span id="edit-customer-name-title" class="text-info"></span></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <label for="customer-notes-textarea" class="form-label small text-muted">Customer Notes / Preferences</label>
                        <textarea id="customer-notes-textarea" class="form-control form-control-glitch" rows="4" placeholder="Enter seating preferences, allergies, custom instructions..."></textarea>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-glitch">Save Notes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
